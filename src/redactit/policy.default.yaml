# Redactit policy. An admin-managed copy is merged with this file, and the merge can only
# make redaction stricter (docs/PLAN.md §6).
version: 1

dial:
  position: 3        # 1 (loosest) to 5 (tightest)
  admin_floor: 3     # users cannot go below this; it is the lowest dial the leak test proves

review:
  mode: low_confidence_only   # or: always. An item awaiting review always blocks the send.

# Actions:
#   pseudonymize  "Priya Okafor" -> "[PERSON_1]", consistent within one chat
#   mask          every letter and digit -> "*", separators kept: "***-**-****"
#   strike        the whole value -> "█" of the same length
#   omit          the value is removed
#   box           PDF and images: filled box (labelled when the entity is pseudonymized)
# locked: true    applies at every dial position, and a user policy cannot unlock it
entities:
  PERSON:        {action: pseudonymize}
  ADDRESS:       {action: pseudonymize}
  EMAIL:         {action: pseudonymize}
  PHONE:         {action: mask}
  DATE_OF_BIRTH: {action: mask}
  COMPANY_TERM:  {action: pseudonymize}
  CREDIT_CARD:   {action: mask, locked: true}
  IBAN:          {action: mask, locked: true}
  CA_SIN:        {action: mask, locked: true}
  US_SSN:        {action: mask, locked: true}
  UK_NINO:       {action: mask, locked: true}
  PASSPORT:      {action: mask, locked: true}
  API_KEY:       {action: strike, locked: true}
  FACE:          {action: box, locked: true}       # images and PDF pages only
  BARCODE:       {action: box, locked: true}       # QR and barcodes can encode anything

custom_terms:
  files: []          # one term per line: client names, project codenames
  terms: []
allowlist: []        # never redacted, e.g. your own company name. Admin file only.

vault:
  retention_days: 30   # also how long the folder watcher keeps its redacted copies

sites:
  chatgpt.com: {dial: 4}   # per-site dial; can raise, never lower, the effective dial
