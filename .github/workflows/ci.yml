name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI never needs to write to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # one OS failing must not hide the others' results
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      REDACTIT_MODEL_DIR: .models
    steps:
      # Pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # The project's floor, not plain "3.12": Ubuntu's system 3.12.3 is too old (owner-only
          # temp folders need 3.12.4), and a range lets uv fetch its own 3.12 where needed.
          python-version: ">=3.12.4,<3.13"
      - run: uv sync --locked
      # Models are fetched once per lockfile change; the tests themselves stay offline.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .models
          key: models-${{ hashFiles('src/redactit/models.lock.json') }}
      - run: uv run redactit setup-models
      - run: uv run pytest -q
