[project]
name = "redactit"
version = "0.1.0"
description = "Local-first redaction of sensitive data before it reaches an LLM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12.4,<3.13"
# Engine dependencies are added alongside the code that uses them.
dependencies = [
    "cryptography==50.0.1",
    "defusedxml==0.7.1",
    "en-core-web-sm",
    "keyring==25.7.0",
    "onnxruntime==1.30.0",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    "platformdirs==4.12.0",
    "presidio-analyzer==2.2.364",
    "pydantic==2.13.5",
    "pyobjc-framework-cocoa==12.2.2 ; sys_platform == 'darwin'",
    "pypdfium2==5.13.0",
    "pyyaml==6.0.3",
    "rapidocr-onnxruntime==1.4.4",
    "spacy==3.8.16",
    "tokenizers==0.23.2",
    "watchdog==6.0.0",
    "zxing-cpp==3.1.1",
]

[project.scripts]
redactit = "redactit.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-socket==0.8.1"]
# Drives a real Chromium with the unpacked extension for the browser tests. Never shipped.
e2e = ["playwright==1.63.0"]
# Builds the synthetic corpus and re-extracts outputs for the leak test. Never shipped.
leak = ["Faker==40.39.0", "reportlab==5.0.1"]

[tool.uv]
default-groups = ["dev", "leak"]
# rapidocr asks for the GUI build of OpenCV, whose Linux and macOS wheels also bundle Qt
# and other LGPL libraries; the headless build (a direct dependency) provides the same cv2.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/corpus", "tests/leak"]
# The engine must never make a network call; --disable-socket makes any
# attempt fail the test instead of leaking data silently.
addopts = "--disable-socket"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
